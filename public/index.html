<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0", maximum-scale=1.0, user-scalable=no" />
    <title>PiratesMap - Sid Meier's Pirates! Map Viewer</title>
    
    <!-- Leaflet & Plugins CSS -->
    <link rel="stylesheet" href="styles/leaflet.css">
    <link rel="stylesheet" href="styles/leaflet-search.min.css">
    <link rel="stylesheet" href="styles/Leaflet.Dialog.css">
    <link rel="stylesheet" href="styles/leaflet-panel-layers.min.css">
    <!-- Project CSS -->
    <link rel="stylesheet" href="styles/style.css">

    <!-- Leaflet & Plugins JS -->
    <script src="scripts/leaflet.js"></script>
    <script src="scripts/leaflet-search.min.js"></script>
    <script src="scripts/leaflet.latlng-graticule.js"></script>
    <script src="scripts/Leaflet.Dialog.js"></script>
    <script src="scripts/leaflet-panel-layers.min.js"></script>
    <!-- Jimp for image processing -->
    <script src="https://cdn.jsdelivr.net/npm/jimp/browser/lib/jimp.min.js"></script>
    <!-- Leaflet-smooth-marker-bouncing -->
    <script src="scripts/leaflet-smoothmarkerbouncing-bundle.min.js"></script>
    </head>
    <body>
    <script type="text/javascript">
        (()=>{
            let noscriptlink=document.createElement("div");
            noscriptlink.id="noscriptlink";
            noscriptlink.innerHTML=`<small><a href="noscript.html">Go here for NoScript version (static image)<a/>&nbsp;&nbsp;<a href="#" onClick="document.getElementById('noscriptlink').style.display='none';">(Hide this)</a></small>`;
            document.body.appendChild(noscriptlink);
            let map=document.createElement("div");
            map.id="map";
            document.body.appendChild(map);
        })()
    </script>
    <noscript>
        <iframe src="noscript.html"  width="100%" height="100vh" style="border:none; height: 100vh;"">
        </iframe>
    </noscript>
    <!-- Data & Application Logic -->
    <script src="scripts/cities.js"></script>
    <script src="scripts/map.js"></script>
    <script src="scripts/analyze.js"></script>
    </body>
    </html>
